name: Deploy Wedding Invitation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production bundle
        run: |
          pnpm build
          mkdir -p dist/fine-art dist/vogue dist/starlight dist/indochine dist/minimal dist/tone-trang dist/garden dist/calla-do dist/calla dist/khu-vuon
          cp dist/index.html dist/fine-art/index.html
          cp dist/index.html dist/vogue/index.html
          cp dist/index.html dist/starlight/index.html
          cp dist/index.html dist/indochine/index.html
          cp dist/index.html dist/minimal/index.html
          cp dist/index.html dist/tone-trang/index.html
          cp dist/index.html dist/garden/index.html
          cp dist/index.html dist/calla-do/index.html
          cp dist/index.html dist/calla/index.html
          cp dist/index.html dist/khu-vuon/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
